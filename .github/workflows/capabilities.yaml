name: Generate connector capabilities

on:
  push:
    branches:
      - main

jobs:
  calculate-capabilities:
    runs-on: ubuntu-latest

    steps:
      - name: Mint baton-ci app token
        id: ci-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.BATON_CI_CLIENT_ID }}
          private-key: ${{ secrets.BATON_CI_SECRET_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          token: ${{ steps.ci-token.outputs.token }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -o connector ./cmd/baton-file

      - name: Run and save output
        run: |
          # Fixture covers all traits in pkg/connector/resource_types.go TraitMap.
          # If a new trait is added to TraitMap, add the corresponding resource here.
          cat > /tmp/caps.yaml << 'EOF'
          users:
            - id: u1
              display_name: User 1
          resources:
            - resource_type: group
              trait: group
              id: g1
              display_name: Group 1
            - resource_type: role
              trait: role
              id: r1
              display_name: Role 1
            - resource_type: app
              trait: app
              id: a1
              display_name: App 1
            - resource_type: secret
              trait: secret
              id: s1
              display_name: Secret 1
          direct_user_grants: []
          grant_inheritance_mappings: []
          EOF
          ./connector --input /tmp/caps.yaml capabilities > baton_capabilities.json
          ./connector config > config_schema.json

      - name: Commit changes
        uses: EndBug/add-and-commit@v9
        with:
          default_author: github_actions
          message: "Updating baton capabilities."
          add: |
            baton_capabilities.json
            config_schema.json
